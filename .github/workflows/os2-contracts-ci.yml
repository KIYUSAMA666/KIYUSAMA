name: OS 2.0 Contracts CI

on:
  pull_request:
    paths:
      - 'kiyusama-device/packages/contracts/**'
      - 'kiyusama-device/tests/contracts/**'
      - 'kiyusama-device/tsconfig.contracts.json'
      - 'kiyusama-device/package.json'
      - '.github/workflows/os2-contracts-ci.yml'

concurrency:
  group: os2-contracts-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and test contracts
        working-directory: kiyusama-device
        run: npm run test:contracts
