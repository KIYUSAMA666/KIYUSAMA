name: OS2 Contract Freeze

on:
  push:
    branches:
      - sora/os2-contract-code-freeze-20260905
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned TypeScript for isolated contract build
        working-directory: kiyusama-device
        run: npm install --no-save --ignore-scripts typescript@5.8.3

      - name: Build and test locked contracts
        working-directory: kiyusama-device
        run: npm run test:contracts
