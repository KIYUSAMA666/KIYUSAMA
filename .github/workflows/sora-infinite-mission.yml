name: SORA Infinite Mission Zero-Cost V1

on:
  push:
    branches: [main]
    paths:
      - 'SORA_INFINITE_MISSION.md'
      - '.github/workflows/sora-infinite-mission.yml'
  # Primary continuation is self-dispatch. GitHub schedule is intentionally not used
  # because repository-wide schedule delivery has shown multi-hour gaps.
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  id-token: write

concurrency:
  group: sora-infinite-mission-zero-cost
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install pinned Ollama
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSLo /tmp/ollama-install.sh https://github.com/ollama/ollama/releases/download/v0.34.0/install.sh
          echo "25f64b810b947145095956533e1bdf56eacea2673c55a7e586be4515fc882c9f  /tmp/ollama-install.sh" | sha256sum -c -
          OLLAMA_VERSION=0.34.0 sh /tmp/ollama-install.sh
          ollama serve >/tmp/ollama.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:11434/api/tags >/dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull qwen2.5-coder:0.5b

      - name: Resume prior runtime state
        shell: bash
        run: |
          git fetch origin ago-runtime-state:refs/remotes/origin/ago-runtime-state || true
          git show origin/ago-runtime-state:SORA_INFINITE_STATE.json > /tmp/prior-state.json 2>/dev/null || true
          if [ -s /tmp/prior-state.json ]; then cp /tmp/prior-state.json SORA_INFINITE_STATE.json; fi

      - name: Autonomous heartbeat
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, urllib.request
          from pathlib import Path

          mission_path = Path("SORA_INFINITE_MISSION.md")
          state_path = Path("SORA_INFINITE_STATE.json")
          mission = mission_path.read_text()
          before_hash = hashlib.sha256(mission.encode()).hexdigest()
          state = json.loads(state_path.read_text())

          prompt = """You are the actor in a bounded autonomous mission heartbeat.
          Preserve the fixed GOAL and GUARDS exactly. Never claim tests you did not run.
          Read the mission and current state. Return ONE short next safe action and end with
          STATUS=CONTINUE, STATUS=COMPLETE, or STATUS=HUMAN_REQUIRED.
          This heartbeat may only reason and propose the next repo-local safe action; it has no secrets.

          MISSION:
          """ + mission + "\nSTATE:\n" + json.dumps(state)

          body = json.dumps({"model":"qwen2.5-coder:0.5b","prompt":prompt,"stream":False}).encode()
          req = urllib.request.Request("http://127.0.0.1:11434/api/generate", data=body, headers={"Content-Type":"application/json"})
          with urllib.request.urlopen(req, timeout=300) as resp:
              actor = json.loads(resp.read())["response"].strip()

          # The model is advisory; it must never be able to stop the liveness heart.
          # Terminal control belongs to an explicit durable control plane, not free-form model output.
          status = "CONTINUE"

          state["run_count"] = int(state.get("run_count", 0)) + 1
          state["status"] = status
          state["last_run_id"] = os.environ["RUN_ID"]
          state["last_actor_output"] = actor[:4000]
          state["mission_sha256"] = before_hash
          state_path.write_text(json.dumps(state, indent=2, ensure_ascii=False) + "\n")

          after_hash = hashlib.sha256(mission_path.read_bytes()).hexdigest()
          assert before_hash == after_hash, "mission changed during actor step"
          assert state["run_count"] >= 1
          print(actor)
          print("FRESH_VERIFY=PASS mission_hash_unchanged run_count=" + str(state["run_count"]))
          PY

      - name: Persist cross-run state
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- SORA_INFINITE_STATE.json; then
            echo "No state change"
            exit 0
          fi
          cp SORA_INFINITE_STATE.json /tmp/next-state.json
          git config user.name "sora-infinite-bot"
          git config user.email "sora-infinite-bot@users.noreply.github.com"
          # Preserve the actor-produced state in /tmp, then clean the tracked
          # worktree copy before switching to the dedicated runtime branch.
          git restore --source=HEAD --staged --worktree -- SORA_INFINITE_STATE.json
          git fetch origin ago-runtime-state:refs/remotes/origin/ago-runtime-state
          git checkout -B ago-runtime-state origin/ago-runtime-state
          cp /tmp/next-state.json SORA_INFINITE_STATE.json
          git add SORA_INFINITE_STATE.json
          git commit -m "A-GO heartbeat: persist autonomous state [skip ci]"
          git push origin ago-runtime-state

      - name: OPEN ROOM pending patrol wake
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BRIDGE: https://zdypjilutgxjsneultqj.supabase.co/functions/v1/open-room-github-oidc-probe-v1
        run: |
          set -euo pipefail
          OIDC_JSON="$(curl --fail-with-body -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=kiyusama-open-room")"
          export OIDC_TOKEN="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$OIDC_JSON")"
          WORK_JSON="$(curl --fail-with-body -sS -H "Authorization: Bearer $OIDC_TOKEN" "$BRIDGE")"
          export WORK_JSON
          PENDING="$(python3 - <<'PY'
          import json, os
          x=json.loads(os.environ["WORK_JSON"])
          assert len(x)==12, len(x)
          print(sum(1 for r in x if not r.get("processed",False)))
          PY
          )"
          echo "OPEN_ROOM_PENDING_PATROLS=$PENDING"
          if [ "$PENDING" -gt 0 ]; then
            curl --fail-with-body --retry 5 --retry-all-errors               -X POST               -H "Accept: application/vnd.github+json"               -H "Authorization: Bearer $GH_TOKEN"               -H "X-GitHub-Api-Version: 2026-03-10"               "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/open-room-actor-canary-v1.yml/dispatches"               -d '{"ref":"main"}'
            echo "OPEN_ROOM_ACTOR_WAKE_DISPATCHED=PASS"
          else
            echo "OPEN_ROOM_ACTOR_WAKE_DISPATCHED=SKIP_ALREADY_PROCESSED"
          fi

      - name: Permanent GO self-dispatch
        if: always() && !cancelled()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # COMPLETE/HUMAN_REQUIRED are deliberate terminal states.
          STATUS="CONTINUE"
          if [ -s SORA_INFINITE_STATE.json ]; then
            STATUS="$(python3 -c 'import json; print(json.load(open("SORA_INFINITE_STATE.json")).get("status","CONTINUE"))' 2>/dev/null || echo CONTINUE)"
          fi
          echo "PERMANENT_GO_STATUS=$STATUS"
          case "$STATUS" in
            COMPLETE|HUMAN_REQUIRED)
              echo "PERMANENT_GO_STOP=$STATUS"
              exit 0
              ;;
            CONTINUE) ;;
            *)
              echo "Unknown state; fail closed instead of creating an uncontrolled chain: $STATUS"
              exit 1
              ;;
          esac

          # Cadence guard: the successor is created by the current live run, not cron.
          sleep 240

          curl --fail-with-body --retry 5 --retry-all-errors \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/sora-infinite-mission.yml/dispatches" \
            -d '{"ref":"main"}'

          echo "PERMANENT_GO_SUCCESSOR_DISPATCHED=PASS"
