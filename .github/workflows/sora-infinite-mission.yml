name: SORA Infinite Mission

on:
  push:
    branches: [main]
    paths:
      - 'SORA_INFINITE_MISSION.md'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: sora-infinite-mission
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install OpenAI SDK
        run: npm install openai@latest

      - name: Continue mission
        env:
          OPENAI_WIF_AUDIENCE: ${{ vars.OPENAI_WIF_AUDIENCE }}
          OPENAI_IDENTITY_PROVIDER_ID: ${{ vars.OPENAI_IDENTITY_PROVIDER_ID }}
          OPENAI_SERVICE_ACCOUNT_ID: ${{ vars.OPENAI_SERVICE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/run.mjs <<'EOF'
          import fs from "node:fs";
          import OpenAI from "openai";
          const audience = process.env.OPENAI_WIF_AUDIENCE;
          const identityProviderId = process.env.OPENAI_IDENTITY_PROVIDER_ID;
          const serviceAccountId = process.env.OPENAI_SERVICE_ACCOUNT_ID;
          const requestURL = process.env.ACTIONS_ID_TOKEN_REQUEST_URL;
          const requestToken = process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN;
          if (!audience || !identityProviderId || !serviceAccountId || !requestURL || !requestToken) throw new Error("WIF runtime identifiers unavailable");
          const provider = { tokenType: "jwt", getToken: async () => {
            const url = new URL(requestURL); url.searchParams.set("audience", audience);
            const response = await fetch(url, {headers:{Authorization: `bearer ${requestToken}`}});
            if (!response.ok) throw new Error(`GitHub OIDC failed: ${response.status}`);
            const body = await response.json(); if (!body.value) throw new Error("OIDC token missing"); return body.value;
          }};
          const client = new OpenAI({workloadIdentity:{identityProviderId,serviceAccountId,provider}});
          const mission = fs.readFileSync("SORA_INFINITE_MISSION.md","utf8");
          const response = await client.responses.create({model:"gpt-5.6-terra",input:"SORA INFINITE MISSION heartbeat. Read this fixed mission and return the next safe step without changing its goal. Never fabricate PASS. End STATUS=CONTINUE, STATUS=COMPLETE, or STATUS=HUMAN_REQUIRED.\n\n"+mission});
          console.log(response.output_text);
          EOF
          node /tmp/run.mjs

        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/mission.md <<'EOF'
          SORA INFINITE MISSION heartbeat.
          Read SORA_INFINITE_MISSION.md.
          Determine whether COMPLETE or HUMAN_REQUIRED is already evidenced.
          If neither is evidenced, identify and perform the next safe repository-read-only investigation step available in this run.
          Never alter CODEX-S, CODEX-K, KIRA production lanes, security controls, credentials, or protected workflows.
          Never fabricate PASS. End with exactly one status line:
          STATUS=CONTINUE
          STATUS=COMPLETE
          or STATUS=HUMAN_REQUIRED
          EOF
          codex exec --skip-git-repo-check --sandbox read-only --output-last-message /tmp/result.txt - < /tmp/mission.md
          cat /tmp/result.txt
