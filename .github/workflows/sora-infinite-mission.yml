name: SORA Infinite Mission

on:
  push:
    branches: [main]
    paths:
      - 'SORA_INFINITE_MISSION.md'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: sora-infinite-mission
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Mint GitHub OIDC token
        shell: bash
        run: |
          set -euo pipefail
          OIDC_JSON="$(curl --fail --silent --show-error             -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}"             "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=kiyusama-codex-bridge")"
          OIDC_TOKEN="$(printf '%s' "$OIDC_JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          echo "::add-mask::$OIDC_TOKEN"
          echo "KIYUSAMA_GH_OIDC_TOKEN=$OIDC_TOKEN" >> "$GITHUB_ENV"

      - name: Exchange OIDC for Codex bridge token
        shell: bash
        run: |
          set -euo pipefail
          TOKEN_JSON="$(curl --fail --silent --show-error             -X POST             -H "Authorization: Bearer ${KIYUSAMA_GH_OIDC_TOKEN}"             -H "Content-Type: application/json"             https://zdypjilutgxjsneultqj.supabase.co/functions/v1/codex-openai-proxy-v1/token)"
          BRIDGE_TOKEN="$(printf '%s' "$TOKEN_JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')"
          echo "::add-mask::$BRIDGE_TOKEN"
          echo "KIYUSAMA_BRIDGE_TOKEN=$BRIDGE_TOKEN" >> "$GITHUB_ENV"

      - name: Install Codex CLI
        run: npm install -g @openai/codex@0.144.5

      - name: Configure secretless provider
        shell: bash
        run: |
          mkdir -p "$HOME/.codex"
          cat > "$HOME/.codex/config.toml" <<'EOF'
          model_provider = "kiyusama-proxy"
          approval_policy = "never"
          sandbox_mode = "read-only"

          [model_providers.kiyusama-proxy]
          name = "KIYUSAMA OIDC Responses Proxy"
          base_url = "https://zdypjilutgxjsneultqj.supabase.co/functions/v1/codex-openai-proxy-v1/v1"
          env_key = "KIYUSAMA_BRIDGE_TOKEN"
          wire_api = "responses"
          requires_openai_auth = false
          request_max_retries = 1
          EOF

      - name: Continue mission
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/mission.md <<'EOF'
          SORA INFINITE MISSION heartbeat.
          Read SORA_INFINITE_MISSION.md.
          Determine whether COMPLETE or HUMAN_REQUIRED is already evidenced.
          If neither is evidenced, identify and perform the next safe repository-read-only investigation step available in this run.
          Never alter CODEX-S, CODEX-K, KIRA production lanes, security controls, credentials, or protected workflows.
          Never fabricate PASS. End with exactly one status line:
          STATUS=CONTINUE
          STATUS=COMPLETE
          or STATUS=HUMAN_REQUIRED
          EOF
          codex exec --skip-git-repo-check --sandbox read-only --output-last-message /tmp/result.txt - < /tmp/mission.md
          cat /tmp/result.txt
