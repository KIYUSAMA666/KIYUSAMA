name: Codex Task Runner

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/codex-task-runner.yml'
      - '.codex/tasks/NEXT_TASK.md'

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  run-task:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Mint GitHub OIDC token
        shell: bash
        run: |
          set -euo pipefail
          OIDC_JSON="$(curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=kiyusama-codex-bridge")"
          OIDC_TOKEN="$(printf '%s' "$OIDC_JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          echo "::add-mask::$OIDC_TOKEN"
          echo "KIYUSAMA_GH_OIDC_TOKEN=$OIDC_TOKEN" >> "$GITHUB_ENV"

      - name: Build guarded Codex prompt
        shell: bash
        run: |
          set -euo pipefail
          test -f .codex/tasks/NEXT_TASK.md
          cat > .codex/RUNTIME_PROMPT.md <<'EOF'
          You are the implementation agent for KIYUSAMA OS.
          Execute only the task below inside this repository.
          Do not modify .github/ or .codex/.
          Do not expose credentials, tokens, environment variables, or secrets.
          Do not change repository security controls.
          Make the smallest safe change that satisfies the task.

          --- TASK START ---
          EOF
          cat .codex/tasks/NEXT_TASK.md >> .codex/RUNTIME_PROMPT.md
          cat >> .codex/RUNTIME_PROMPT.md <<'EOF'

          --- TASK END ---
          EOF

      - name: Run Codex task
        id: run_codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ env.KIYUSAMA_GH_OIDC_TOKEN }}
          responses-api-endpoint: https://zdypjilutgxjsneultqj.supabase.co/functions/v1/codex-openai-proxy-v1/v1/responses
          permission-profile: ':workspace'
          safety-strategy: drop-sudo
          prompt-file: .codex/RUNTIME_PROMPT.md

      - name: Enforce protected paths
        shell: bash
        run: |
          set -euo pipefail
          git restore --source=HEAD -- .github .codex || true

      - name: Prepare Codex change PR
        id: prepare
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "CODEX_TASK_STATUS=NO_CHANGES"
            exit 0
          fi
          BRANCH="codex/auto-${GITHUB_RUN_ID}"
          git config user.name "KIYUSAMA Codex Runner"
          git config user.email "codex-runner@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "Codex autonomous task ${GITHUB_RUN_ID}"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --set-upstream origin "$BRANCH"
          PR_URL="$(gh pr create --base main --head "$BRANCH" --title "Codex autonomous task ${GITHUB_RUN_ID}" --body "Created automatically by the KIYUSAMA OS Codex OIDC task runner. No OpenAI API key is stored in GitHub. Review before merging.")"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
          echo "CODEX_TASK_STATUS=PR_CREATED"
          echo "CODEX_TASK_PR=$PR_URL"
