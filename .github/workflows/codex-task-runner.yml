name: Codex Task Runner

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/codex-task-runner.yml'
      - '.codex/tasks/NEXT_TASK.md'

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  run-task:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install Codex CLI
        run: npm install -g @openai/codex@0.144.5

      - name: Enable Linux sandbox prerequisites
        shell: bash
        run: |
          set -euo pipefail
          current_userns="$(sysctl -n kernel.unprivileged_userns_clone 2>/dev/null || true)"
          if [ -n "$current_userns" ] && [ "$current_userns" != "1" ]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          current_apparmor="$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true)"
          if [ -n "$current_apparmor" ] && [ "$current_apparmor" != "0" ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Mint GitHub OIDC token
        shell: bash
        run: |
          set -euo pipefail
          OIDC_JSON="$(curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=kiyusama-codex-bridge")"
          OIDC_TOKEN="$(printf '%s' "$OIDC_JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          echo "::add-mask::$OIDC_TOKEN"
          echo "KIYUSAMA_GH_OIDC_TOKEN=$OIDC_TOKEN" >> "$GITHUB_ENV"

      - name: Exchange OIDC for compact bridge token
        shell: bash
        run: |
          set -euo pipefail
          TOKEN_JSON="$(curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${KIYUSAMA_GH_OIDC_TOKEN}" \
            -H "Content-Type: application/json" \
            https://zdypjilutgxjsneultqj.supabase.co/functions/v1/codex-openai-proxy-v1/token)"
          BRIDGE_TOKEN="$(printf '%s' "$TOKEN_JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')"
          test "${#BRIDGE_TOKEN}" -lt 1024
          echo "::add-mask::$BRIDGE_TOKEN"
          echo "KIYUSAMA_BRIDGE_TOKEN=$BRIDGE_TOKEN" >> "$GITHUB_ENV"

      - name: Configure secretless Codex provider
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.codex"
          cat > "$HOME/.codex/config.toml" <<'EOF'
          model_provider = "kiyusama-proxy"
          approval_policy = "never"
          sandbox_mode = "workspace-write"

          [model_providers.kiyusama-proxy]
          name = "KIYUSAMA OIDC Responses Proxy"
          base_url = "https://zdypjilutgxjsneultqj.supabase.co/functions/v1/codex-openai-proxy-v1/v1"
          env_key = "KIYUSAMA_BRIDGE_TOKEN"
          wire_api = "responses"
          requires_openai_auth = false
          request_max_retries = 1
          EOF

      - name: Build guarded Codex prompt
        shell: bash
        run: |
          set -euo pipefail
          test -f .codex/tasks/NEXT_TASK.md
          cat > .codex/RUNTIME_PROMPT.md <<'EOF'
          You are the implementation agent for KIYUSAMA OS.
          Execute only the task below inside this repository.
          Do not modify .github/ or .codex/.
          Do not expose credentials, tokens, environment variables, or secrets.
          Do not change repository security controls.
          Make the smallest safe change that satisfies the task.

          --- TASK START ---
          EOF
          cat .codex/tasks/NEXT_TASK.md >> .codex/RUNTIME_PROMPT.md
          cat >> .codex/RUNTIME_PROMPT.md <<'EOF'

          --- TASK END ---
          EOF

      - name: Run Codex task
        shell: bash
        run: |
          set -euo pipefail
          codex exec \
            --skip-git-repo-check \
            --sandbox workspace-write \
            --output-last-message /tmp/codex-task-result.txt \
            - < .codex/RUNTIME_PROMPT.md
          echo '--- CODEX FINAL MESSAGE ---'
          cat /tmp/codex-task-result.txt

      - name: Enforce protected paths
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git restore --source=HEAD -- .github .codex || true
          rm -f .codex/RUNTIME_PROMPT.md

      - name: Prepare Codex change handoff
        if: success()
        id: prepare
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain --untracked-files=all)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "CODEX_TASK_STATUS=NO_CHANGES"
            exit 0
          fi
          BRANCH="codex/auto-${GITHUB_RUN_ID}"
          git config user.name "KIYUSAMA Codex Runner"
          git config user.email "codex-runner@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "Codex autonomous task ${GITHUB_RUN_ID}"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --set-upstream origin "$BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

          if PR_URL="$(gh pr create --base main --head "$BRANCH" --title "Codex autonomous task ${GITHUB_RUN_ID}" --body "Created automatically by the KIYUSAMA OS Codex OIDC task runner. No OpenAI API key is stored in GitHub. Review before merging." 2>/tmp/codex-pr-error.log)"; then
            echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
            echo "CODEX_TASK_STATUS=PR_CREATED"
            echo "CODEX_TASK_PR=$PR_URL"
          else
            echo "CODEX_TASK_STATUS=BRANCH_READY_FOR_SORA"
            echo "CODEX_TASK_BRANCH=$BRANCH"
            echo "GitHub Actions PR creation is disabled for this repository; branch push succeeded and SORA can create the PR through the connected GitHub integration."
            cat /tmp/codex-pr-error.log || true
          fi
