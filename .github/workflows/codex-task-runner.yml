name: Codex Task Runner

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/codex-task-runner.yml'
      - '.codex/tasks/NEXT_TASK.md'

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  run-task:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install Codex CLI
        run: npm install -g @openai/codex@0.144.5

      - name: Mint GitHub OIDC token
        shell: bash
        run: |
          set -euo pipefail
          OIDC_JSON="$(curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=kiyusama-codex-bridge")"
          OIDC_TOKEN="$(printf '%s' "$OIDC_JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          echo "::add-mask::$OIDC_TOKEN"
          echo "KIYUSAMA_GH_OIDC_TOKEN=$OIDC_TOKEN" >> "$GITHUB_ENV"

      - name: Configure Codex provider
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.codex"
          cat > "$HOME/.codex/config.toml" <<'EOF'
          model_provider = "kiyusama-proxy"
          approval_policy = "never"
          sandbox_mode = "workspace-write"

          [model_providers.kiyusama-proxy]
          name = "KIYUSAMA OIDC Responses Proxy"
          base_url = "https://zdypjilutgxjsneultqj.supabase.co/functions/v1/codex-openai-proxy-v1/v1"
          env_key = "KIYUSAMA_GH_OIDC_TOKEN"
          wire_api = "responses"
          requires_openai_auth = false
          request_max_retries = 1
          EOF

      - name: Run Codex task
        shell: bash
        run: |
          set -euo pipefail
          test -f .codex/tasks/NEXT_TASK.md
          TASK="$(cat .codex/tasks/NEXT_TASK.md)"
          codex exec \
            --skip-git-repo-check \
            --sandbox workspace-write \
            --output-last-message /tmp/codex-task-result.txt \
            "You are the implementation agent for KIYUSAMA OS. Execute only the task below inside this repository. Do not modify .github/ or .codex/. Do not expose credentials or environment variables. Make the smallest safe change that satisfies the task. TASK:\n\n${TASK}"
          echo '--- CODEX FINAL MESSAGE ---'
          cat /tmp/codex-task-result.txt

      - name: Enforce protected paths
        shell: bash
        run: |
          set -euo pipefail
          git restore --source=HEAD -- .github .codex || true

      - name: Prepare Codex change PR
        id: prepare
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "CODEX_TASK_STATUS=NO_CHANGES"
            exit 0
          fi
          BRANCH="codex/auto-${GITHUB_RUN_ID}"
          git config user.name "KIYUSAMA Codex Runner"
          git config user.email "codex-runner@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "Codex autonomous task ${GITHUB_RUN_ID}"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --set-upstream origin "$BRANCH"
          PR_URL="$(gh pr create --base main --head "$BRANCH" --title "Codex autonomous task ${GITHUB_RUN_ID}" --body "Created automatically by the KIYUSAMA OS Codex OIDC task runner. No OpenAI API key was stored in GitHub. Review before merging.")"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
          echo "CODEX_TASK_STATUS=PR_CREATED"
          echo "CODEX_TASK_PR=$PR_URL"
