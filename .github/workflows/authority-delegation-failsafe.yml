name: Authority Delegation Failsafe

on:
  push:
    branches:
      - sora/authority-delegation-failsafe-20260906
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authority-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Re-test frozen Phase 1 contracts
        working-directory: kiyusama-device
        run: |
          npm install --no-save --ignore-scripts typescript@5.8.3
          npm run test:contracts

      - name: Test SORA KIRA delegation and human reclaim failsafe
        working-directory: kiyusama-device
        run: node --test tests/authority/*.test.mjs
