name: Codex Bridge Probe

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/codex-bridge-probe.yml"

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose Vercel Trusted Source with GitHub OIDC
        shell: bash
        run: |
          set -euo pipefail
          OIDC_JSON="$(curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}")"
          OIDC_TOKEN="$(printf '%s' "$OIDC_JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          echo "::add-mask::$OIDC_TOKEN"

          python3 - "$OIDC_TOKEN" <<'PY'
          import base64, json, sys
          token = sys.argv[1]
          payload = token.split('.')[1]
          payload += '=' * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          safe_keys = [
              "iss", "aud", "sub", "repository", "repository_owner",
              "repository_id", "repository_owner_id", "ref", "ref_type",
              "environment", "workflow", "workflow_ref", "workflow_sha",
              "job_workflow_ref", "event_name", "actor", "actor_id"
          ]
          for key in safe_keys:
              if key in claims:
                  print(f"GITHUB_OIDC_CLAIM_{key.upper()}={claims[key]}")
          PY

          TARGET="https://kiyusama-os-write-test-b6zjxcfy8-masa1234k-2475s-projects.vercel.app/api/github-app-preflight-v2"
          # Capture only allowlisted response metadata. Never print token, cookie, or body.
          HTTP_CODE="$(curl --silent --show-error --max-redirs 0 \
            --dump-header /tmp/vercel-response-headers.txt \
            --output /dev/null \
            --write-out '%{http_code}' \
            --request POST \
            --header "x-vercel-trusted-oidc-idp-token: $OIDC_TOKEN" \
            --header "content-type: application/json" \
            "$TARGET" || true)"
          echo "VERCEL_TRUSTED_SOURCE_HTTP=$HTTP_CODE"
          python3 - <<'PY'
          from pathlib import Path
          for line in Path('/tmp/vercel-response-headers.txt').read_text(errors='replace').splitlines():
              if ':' not in line: continue
              key, value = line.split(':', 1)
              if key.lower() in {'location', 'x-vercel-id', 'x-vercel-error', 'x-vercel-mitigated', 'www-authenticate'}:
                  # Location may contain sensitive query params: emit host/path only.
                  if key.lower() == 'location':
                      from urllib.parse import urlsplit
                      u = urlsplit(value.strip())
                      value = (u.scheme + '://' + u.netloc + u.path) if u.scheme else u.path
                  print('RESPONSE_' + key.upper().replace('-', '_') + '=' + value.strip())
          PY

      - name: Check whether OPENAI_API_KEY is configured
        id: keycheck
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "OPENAI_API_KEY is configured."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "OPENAI_API_KEY is not configured."
          fi

      - name: Checkout repository
        if: steps.keycheck.outputs.present == 'true'
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Run Codex read-only connectivity probe
        if: steps.keycheck.outputs.present == 'true'
        id: codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":read-only"
          prompt: |
            Connectivity probe only. Do not modify files. Read the repository name and return exactly:
            CODEX_BRIDGE_OK KIYUSAMA666/KIYUSAMA

      - name: Report probe result
        shell: bash
        env:
          KEY_PRESENT: ${{ steps.keycheck.outputs.present }}
          CODEX_RESULT: ${{ steps.codex.outputs.final-message }}
        run: |
          if [ "$KEY_PRESENT" != "true" ]; then
            echo "CODEX_BRIDGE_STATUS=BLOCKED_MISSING_OPENAI_API_KEY"
            exit 0
          fi

          echo "Codex output: $CODEX_RESULT"
          if [ "$CODEX_RESULT" = "CODEX_BRIDGE_OK KIYUSAMA666/KIYUSAMA" ]; then
            echo "CODEX_BRIDGE_STATUS=OK"
          else
            echo "CODEX_BRIDGE_STATUS=UNEXPECTED_RESPONSE"
            exit 1
          fi
