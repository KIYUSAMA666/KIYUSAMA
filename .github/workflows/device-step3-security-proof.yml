name: DEVICE Step3 Security Proof

on:
  workflow_dispatch:
  push:
    branches:
      - sora/device-step3-security-20260831
    paths:
      - 'kiyusama-device/packages/security/**'
      - 'kiyusama-device/tests/security/**'
      - 'kiyusama-device/tsconfig.security.json'
      - 'kiyusama-device/package.json'
      - '.github/workflows/device-step3-security-proof.yml'

permissions:
  contents: read

jobs:
  security-proof:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kiyusama-device
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Runtime information
        run: |
          echo "STEP3_COMMIT_SHA=${GITHUB_SHA}"
          echo "STEP3_BRANCH=${GITHUB_REF_NAME}"
          node --version
          npm --version
          uname -a

      - name: Install TypeScript compiler
        run: |
          npm install --no-save --no-package-lock typescript@5
          npx tsc --version

      - name: Build and run S3-01 through S3-06
        run: npm run test:security

      - name: Regression contracts
        run: npm run test:contracts
