name: Guardian RETURN isolated test
on:
  push:
    branches:
      - sora/guardian-return-isolated-check-20261009
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test guardian/return-gate.test.mjs guardian/cloud-send-reservation.test.mjs guardian/sql/guardian-send-reserve.static.test.mjs guardian/postgres-reservation-proof.test.mjs guardian/keeper-wake-proof-gate.test.mjs guardian/keeper-event-machine.test.mjs guardian/keeper-runtime-liveness-gate.test.mjs
