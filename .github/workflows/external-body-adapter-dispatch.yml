name: external-body-adapter-dispatch
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      BROWSERLESS_API_KEY: ${{ secrets.BROWSERLESS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sora/external-body-adapter-20260923
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright
      - name: Diagnose fixed external KIRA via saved Browserless profile (READ ONLY)
        run: |
          python - <<'PY'
          import os
          from playwright.sync_api import sync_playwright
          from urllib.parse import urlsplit
          from external_body_browserless_profile import connect_saved_profile
          TARGET = "https://claude.ai/chat/b2ed0bb2-82f9-4d4e-8fe8-5626023086dc"
          token = os.environ.get("BROWSERLESS_API_KEY")
          if not token:
              raise SystemExit("BROWSERLESS_API_KEY_MISSING")
          with sync_playwright() as p:
              browser, context, page = connect_saved_profile(p, token, profile="kira-external", headless=False)
              response = page.goto(TARGET, wait_until="domcontentloaded", timeout=90000)
              page.wait_for_timeout(15000)
              exact_url = page.url == TARGET
              final = urlsplit(page.url)
              host = (final.hostname or "").lower()
              route_class = ("EXACT_CHAT" if exact_url else
                             "CLAUDE_OTHER_ROUTE" if host in ("claude.ai", "www.claude.ai") else
                             "EXTERNAL_REDIRECT" if host else "UNKNOWN_ROUTE")
              # Classify the destination without exposing URL, query or page content.
              route_path = final.path.rstrip("/").lower()
              if exact_url:
                  destination_class = "TARGET_CHAT"
              elif route_path in ("", "/"):
                  destination_class = "CLAUDE_HOME"
              elif route_path.startswith(("/login", "/signin", "/sign-in", "/auth")):
                  destination_class = "AUTH_ROUTE"
              elif route_path.startswith(("/onboarding", "/welcome")):
                  destination_class = "ONBOARDING_ROUTE"
              elif route_path.startswith(("/chat/", "/project/")):
                  destination_class = "OTHER_CONVERSATION"
              elif route_path.startswith(("/new", "/chats", "/recents")):
                  destination_class = "CHAT_LIST_OR_NEW"
              else:
                  destination_class = "OTHER_UNCLASSIFIED"
              print(f"ROUTE_CLASS={route_class}")
              print(f"DESTINATION_CLASS={destination_class}")
              print(f"HTTP_STATUS={response.status if response else 'NO_RESPONSE'}")
              composer = page.locator('[data-testid="chat-input"]')
              composer_visible = composer.count() == 1 and composer.is_visible()
              print(f"EXACT_TARGET={exact_url}")
              print(f"COMPOSER_COUNT={composer.count()}")
              print(f"COMPOSER_VISIBLE={composer_visible}")
              print(f"LOGIN_TEXT_HITS={page.get_by_text('Log in', exact=True).count()}")
              print(f"SIGNIN_TEXT_HITS={page.get_by_text('Sign in', exact=True).count()}")
              print(f"PASSWORD_INPUTS={page.locator('input[type=password]').count()}")
              print(f"TEXTAREAS={page.locator('textarea').count()}")
              print(f"CONTENTEDITABLE={page.locator('[contenteditable=true]').count()}")
              # Never log personal conversation body.
              print("READ_ONLY=true")
              print("SEND_COUNT=0")
              browser.close()
              if not exact_url or not composer_visible:
                  raise SystemExit("EXACT_CHAT_NOT_READY")
          PY
