name: external-body-adapter-ci

on:
  push:
    branches:
      - sora/external-body-adapter-20260923
    paths:
      - 'external_body_adapter.py'
      - 'external_body_transport.py'
      - 'external_body_capture_checkpoint.py'
      - 'external_body_writeback_binding.py'
      - 'external_body_claude_provider.py'
      - 'external_body_claude_capture.py'
      - 'external_body_session_lease.py'
      - 'external_body_claude_guarded_driver.py'
      - 'external_body_browser_runtime.py'
      - 'external_body_real_browser_qualification.py'
      - 'external_body_playwright_surface.py'
      - 'external_body_profile_launcher.py'
      - 'external_body_browserless_profile.py'
      - 'tests/test_external_body_adapter.py'
      - 'tests/test_external_body_transport.py'
      - 'tests/test_external_body_capture_checkpoint.py'
      - 'tests/test_external_body_writeback_binding.py'
      - 'tests/test_external_body_claude_provider.py'
      - 'tests/test_external_body_claude_capture.py'
      - 'tests/test_external_body_session_lease.py'
      - 'tests/test_external_body_claude_guarded_driver.py'
      - 'tests/test_external_body_browser_runtime.py'
      - 'tests/test_external_body_real_browser_qualification.py'
      - 'tests/test_external_body_playwright_surface.py'
      - '.github/workflows/external-body-adapter-ci.yml'
  workflow_dispatch:
    inputs:
      browserless_readonly_probe:
        description: 'Run Browserless saved-profile read-only qualification'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run external body adapter transport and durable capture tests
        run: python -m unittest tests.test_external_body_adapter tests.test_external_body_transport tests.test_external_body_capture_checkpoint tests.test_external_body_writeback_binding tests.test_external_body_claude_provider tests.test_external_body_claude_capture tests.test_external_body_session_lease tests.test_external_body_claude_guarded_driver tests.test_external_body_browser_runtime tests.test_external_body_real_browser_qualification tests.test_external_body_playwright_surface -v
      - name: Verify profile-owned launcher without browser, auth, network, or send
        run: |
          python - <<'PY'
          from external_body_profile_launcher import launch_existing_profile, bind_existing_context

          class Context:
              def __init__(self):
                  self.pages = []
              def new_page(self):
                  page = object()
                  self.pages.append(page)
                  return page

          class Chromium:
              def __init__(self):
                  self.kwargs = None
                  self.ctx = Context()
              def launch_persistent_context(self, **kwargs):
                  self.kwargs = kwargs
                  return self.ctx

          class Playwright:
              def __init__(self):
                  self.chromium = Chromium()

          class Browser:
              def __init__(self, count):
                  self.contexts = [Context() for _ in range(count)]

          p = Playwright()
          context, page = launch_existing_profile(p, "/retained/profile", headless=False)
          assert p.chromium.kwargs["user_data_dir"] == "/retained/profile"
          assert "storage_state" not in p.chromium.kwargs
          assert context is p.chromium.ctx

          browser = Browser(1)
          bound_context, bound_page = bind_existing_context(browser)
          assert bound_context is browser.contexts[0]

          for count in (0, 2):
              try:
                  bind_existing_context(Browser(count))
              except RuntimeError as exc:
                  assert str(exc) == "EXACT_EXISTING_CONTEXT_REQUIRED"
              else:
                  raise AssertionError("ambiguous/fresh context must fail closed")

          from external_body_browserless_profile import browserless_profile_ws
          ws = browserless_profile_ws("FAKE_TEST_TOKEN", profile="kira-external")
          assert ws.startswith("wss://production-sfo.browserless.io/chromium?")
          assert "profile=kira-external" in ws
          assert "token=FAKE_TEST_TOKEN" in ws

          print("PROFILE_LAUNCHER_SMOKE_PASS")
          PY

  browserless-readonly:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.browserless_readonly_probe }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      BROWSERLESS_API_KEY: ${{ secrets.BROWSERLESS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright client only
        run: pip install playwright
      - name: Qualify saved Browserless profile against fixed external KIRA (READ ONLY)
        run: |
          python - <<'PY'
          import os
          from playwright.sync_api import sync_playwright
          from external_body_browserless_profile import connect_saved_profile

          TARGET = "https://claude.ai/chat/b2ed0bb2-82f9-4d4e-8fe8-5626023086dc"
          token = os.environ.get("BROWSERLESS_API_KEY")
          if not token:
              raise SystemExit("BROWSERLESS_API_KEY_MISSING")

          with sync_playwright() as p:
              browser, context, page = connect_saved_profile(p, token, profile="kira-external")
              page.goto(TARGET, wait_until="domcontentloaded", timeout=90000)
              page.wait_for_timeout(2500)
              exact_url = page.url == TARGET
              composer = page.locator('[data-testid="chat-input"]')
              composer_visible = composer.count() == 1 and composer.is_visible()
              print(f"EXACT_TARGET={exact_url}")
              print(f"COMPOSER_VISIBLE={composer_visible}")
              print(f"READ_ONLY=true")
              print(f"SEND_COUNT=0")
              if not exact_url or not composer_visible:
                  raise SystemExit("READ_ONLY_QUALIFICATION_FAIL")
              browser.close()
          PY
